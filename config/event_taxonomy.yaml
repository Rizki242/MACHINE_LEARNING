# FurnaceGuard AI — Taksonomi Event dan Aturan Klasifikasi Teks
# Sumber: README §6 (jenis gangguan), §15 (kode event dan severity)
#
# Berkas ini memetakan teks bahasa Indonesia bebas dari kolom
# GANGGUAN / PENYEBAB / EQUIPMENT pada file PARETO riwayat gangguan
# menjadi event_type, event_location, dan severity terstruktur.
#
# Seluruh kata kunci di bawah diambil dari frasa yang BENAR-BENAR muncul
# di data Unit 1 (2016-01 s/d 2026-05), termasuk salah ketiknya.
# Menambah kata kunci di sini tidak memerlukan perubahan kode Python.

version: "0.1.0"
reviewed_by: null
reviewed_date: null

# --------------------------------------------------------------------
# Normalisasi nama equipment
# Data mentah punya 95 varian ejaan/kapitalisasi untuk Unit 1.
# Pencocokan dilakukan case-insensitive terhadap `patterns` (substring).
# Urutan penting: entri pertama yang cocok menang.
# --------------------------------------------------------------------
equipment_canonical:
  - name: COAL_FEEDER
    patterns: ["coal feeder", "coalfeeder", "coal_feeder", "line feeder"]
  - name: COAL_HANDLING
    patterns: ["bunker", "dome coal yard", "crusher", "line loading", "trafo coal handling"]
  - name: FURNACE
    patterns: ["furnace", "funace"]
  - name: EMBEDDED_TUBE
    patterns: ["embedded tube", "embedded wall", "tube sisi windbox", "tube boiler"]
  - name: CYCLONE
    patterns: ["cyclone", "sealpot", "seal pot"]
  - name: BOILER
    patterns: ["boiler"]
  - name: SOOTBLOWER
    patterns: ["sootblower", "soot blower"]
  - name: ESP
    patterns: ["esp"]
  - name: PAF
    patterns: ["paf", "primary air fan"]
  - name: SAF
    patterns: ["saf", "sa fan", "secondary air fan"]
  - name: IDF
    patterns: ["idf", "id fan"]
  - name: BFP
    patterns: ["bfp", "boiler feed pump"]
  - name: FEEDWATER
    patterns: ["feedwater", "feed water", "economizer", "hph", "extraction"]
  - name: CWP
    patterns: ["cwp", "c3wp", "butterfly valve cwp", "raw pump", "vacuum pump"]
  - name: CONDENSER
    patterns: ["condenser", "condensor", "condeser", "kondensor", "hotwell", "debris"]
  - name: HEAT_EXCHANGER
    patterns: ["heat exchanger", "oil cooler"]
  - name: TURBINE
    patterns: ["turbine", "turbin", "msv", "governoor", "governor", "tsi",
               "axial displacement", "safety valve", "drain main steam"]
  - name: GENERATOR
    patterns: ["generator", "excitation", "excitacy", "reactor", "breaker",
               "electrical protection", "ets cabinet"]
  - name: WTP
    patterns: ["wtp", "sampling rack"]
  - name: EXTERNAL
    patterns: ["external", "eksternal"]
  - name: UNIT
    patterns: ["unit 1", "overhaul"]

# Equipment yang tidak pernah relevan untuk risiko blocking furnace.
# Event dengan equipment ini langsung diberi label `not_furnace_related`
# kecuali teks gangguannya secara eksplisit menyebut furnace/bed/feeder.
non_furnace_equipment:
  - CWP
  - CONDENSER
  - HEAT_EXCHANGER
  - TURBINE
  - GENERATOR
  - WTP
  - EXTERNAL
  - BFP
  - FEEDWATER

