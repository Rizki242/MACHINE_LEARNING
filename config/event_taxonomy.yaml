# --------------------------------------------------------------------
# Severity (README §15)
#   0 = Normal
#   1 = Initial indication
#   2 = Warning
#   3 = Blocking
#   4 = Critical blocking / derating / shutdown / trip
#
# Diturunkan dari kombinasi status kejadian (kolom STATUS pada sumber)
# dan durasi. Aturan dievaluasi berurutan; yang pertama cocok menang.
#
# Kode status pada sumber (jumlah baris Unit 1):
#   Derating: FD 193, MD 49, FD (OMC) 43, OMC 14, FD-MD 2, MD-FD 1
#   Outage  : FO 82, MO 25, OMC 8, FO-MO 6, PO 2, FOL 1, PE 1, FD 1
#   FO  = Forced Outage        MO = Maintenance Outage
#   FD  = Forced Derating      MD = Maintenance Derating
#   PO  = Planned Outage       PE = Planned Extension
#   FOL = Forced Outage akibat gangguan luar
#   OMC = Outside Management Control
# --------------------------------------------------------------------
severity_rules:
  # Catatan pada sheet outage berarti unit benar-benar berhenti, apa pun
  # kode statusnya. Sebagian baris di sheet itu berkode FD atau OMC;
  # menilainya dari kode status saja akan menurunkan severity-nya secara
  # keliru menjadi setara derating.
  - name: outage_panjang
    match_record_kind: outage
    min_duration_hours: 24.0
    severity: 4
    rationale: Outage lebih dari 24 jam — unit berhenti, dampak berat

  - name: outage_pendek
    match_record_kind: outage
    min_duration_hours: 0.0
    severity: 3
    rationale: Unit berhenti — blocking terkonfirmasi

  - name: derating_berat
    match_status_prefix: ["FD", "MD"]
    min_derating_mw: 8.0
    severity: 3
    rationale: Penurunan beban besar — blocking berkembang

  - name: derating_panjang
    match_status_prefix: ["FD", "MD"]
    min_duration_hours: 24.0
    severity: 3
    rationale: Derating berkepanjangan

  - name: derating_biasa
    match_status_prefix: ["FD", "MD", "OMC"]
    min_duration_hours: 0.0
    severity: 2
    rationale: Derating — kondisi abnormal terverifikasi

  - name: default
    match_status_prefix: []
    min_duration_hours: 0.0
    severity: 2
    rationale: Status tidak dikenali — diberi tingkat konservatif

# --------------------------------------------------------------------
# Klasifikator lapis 2 — TF-IDF karakter n-gram
# Dilatih pada label lapis 1 sebagai weak supervision. Analyzer karakter
# dipilih karena data penuh salah ketik: "funace", "pembebeban",
# "batuabra", "indikiasi", "Cute Coal Feeder", "slaging".
# --------------------------------------------------------------------
text_model:
  analyzer: char_wb
  ngram_range: [3, 5]
  min_df: 2
  max_features: 20000
  sublinear_tf: true
  classifier: logistic_regression
  C: 4.0
  class_weight: balanced
  max_iter: 2000
  random_state: 42
  # Prediksi lapis 2 dengan keyakinan di bawah ambang ini tidak
  # dipakai untuk menantang lapis 1.
  min_confidence_to_challenge: 0.60

# Event yang jenisnya berikut dianggap relevan untuk pelabelan
# risiko blocking furnace pada pipeline timeseries.
blocking_event_types:
  - furnace_agglomeration
  - coal_feeder_blocking
  - bottom_ash_blocking
  - return_system_disturbance
  - air_distribution_disturbance
  - tube_leak_bed_erosion

# Event konteks: bukan blocking, tetapi menandai kondisi bahan bakar
# yang terdokumentasi sebagai pemicu aglomerasi dan blocking feeder.
# Dipakai sebagai penanda kondisi, bukan sebagai label target.
context_event_types:
  - coal_quality_derating

# Jenis event yang tidak menandakan gangguan peralatan sama sekali,
# sehingga severity-nya 0 berapa pun status dan durasinya.
zero_severity_event_types:
  - not_furnace_related
  - coal_supply_constraint
  - startup_normalisation

# Jenis event yang tidak pernah dipakai sebagai label target maupun
# konteks. Disimpan hanya agar registry lengkap dan dapat diaudit.
non_target_event_types:
  - not_furnace_related
  - coal_supply_constraint
  - startup_normalisation
  - boiler_auxiliary_other
  - boiler_tube_leak_other
  - fan_disturbance
  - unclassified
