# FurnaceGuard AI — Pemetaan Tag DCS ke Nama Fitur Standar
# Sumber: README §7 (Priority A/B/C) dan §8 (Data Dictionary)
#
# ============================ WAJIB DIBACA ============================
# SELURUH `dcs_tag` MASIH null — BELUM DIPETAKAN.
# Nama tag harus diisi dan diverifikasi oleh engineer operasi atau
# instrumentation PLTU Jeranjang sebelum sistem disambungkan ke data nyata.
#
# Selama `dcs_tag` masih null, satu-satunya sumber timeseries adalah
# generator sintetis (backend/app/data/synthetic.py) yang memakai
# `standard_name` di bawah sebagai nama kolom. Saat tag asli diisi,
# loader memetakan tag -> standard_name tanpa perubahan kode hilir.
# =====================================================================

version: "0.1.0"
mapped_by: null
