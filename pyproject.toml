[project]
name = "furnaceguard-ai"
version = "0.3.0"
description = "Decision-support ML pipeline for early warning of CFB boiler furnace blocking risk at PLTU Jeranjang Unit 1."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
  { name = "Rizki Firmansyah" },
]
keywords = [
  "machine-learning",
  "power-plant",
  "predictive-maintenance",
  "boiler",
  "risk-engine",
  "industrial-ai",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.11",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "pandas>=2.2",
  "numpy>=1.26",
  "openpyxl>=3.1",
  "pyarrow>=15.0",
  "PyYAML>=6.0",
  "scikit-learn>=1.4",
  "xgboost>=2.0",
  "shap>=0.44",
  "joblib>=1.3",
  "matplotlib>=3.8",
  "pypdf>=4.0",
  "PyMuPDF>=1.24",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "jupyter>=1.0",
]

[project.urls]
Homepage = "https://github.com/Rizki242/MACHINE_LEARNING"
Repository = "https://github.com/Rizki242/MACHINE_LEARNING"
Issues = "https://github.com/Rizki242/MACHINE_LEARNING/issues"

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 88
target-version = "py311"
exclude = [
  ".git",
  ".venv",
  "__pycache__",
  ".pytest_cache",
  "backend/datasets",
  "backend/models",
  "backend/reports/figures",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
